<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="128" height="128" rx="28" fill="#07090e" />
  <rect width="128" height="128" rx="28" fill="url(#glow)" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />

  <!-- Outer dial -->
  <circle cx="64" cy="64" r="42" fill="#0f172a" stroke="url(#cyberGrad)" stroke-width="4" stroke-dasharray="210 50" />
  
  <!-- Hour marks -->
  <circle cx="64" cy="30" r="2.5" fill="#38bdf8" />
  <circle cx="98" cy="64" r="2.5" fill="#38bdf8" />
  <circle cx="64" cy="98" r="2.5" fill="#38bdf8" />
  <circle cx="30" cy="64" r="2.5" fill="#38bdf8" />

  <!-- Clock hands -->
  <line x1="64" y1="64" x2="64" y2="40" stroke="#f8fafc" stroke-width="4.5" stroke-linecap="round" />
  <line x1="64" y1="64" x2="84" y2="64" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
  <line x1="64" y1="64" x2="52" y2="76" stroke="#10b981" stroke-width="2" stroke-linecap="round" />

  <!-- Center hub -->
  <circle cx="64" cy="64" r="5" fill="#38bdf8" />
  <circle cx="64" cy="64" r="2" fill="#07090e" />
</svg>
